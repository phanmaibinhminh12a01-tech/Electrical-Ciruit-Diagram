<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDI Automation Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #001a22;
            --bg-glow: #003d4d;
            --accent: #00abfd;
            --text-cyan: #cdf1ff;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-deep);
            /* TẠO NỀN PHỨC HỢP GIỐNG ẢNH THIẾT KẾ */
            background-image: 
                radial-gradient(circle at 50% 50%, var(--bg-glow) 0%, var(--bg-deep) 100%),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png'); /* Lớp vân carbon */
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* TẠO CÁC ĐƯỜNG MẠCH ĐIỆN ẢO (DÙNG CODE CSS) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 171, 253, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 171, 253, 0.05) 1px, transparent 1px);
            background-size: 50px 50px; /* Lưới tọa độ kỹ thuật */
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 60px 0 20px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: white;
            letter-spacing: 10px;
            text-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent);
            margin: 0;
        }

        .search-container {
            text-align: center;
            margin: 40px 0;
        }

        #searchInput {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--accent);
            padding: 15px 30px;
            border-radius: 5px;
            width: 400px;
            color: var(--text-cyan);
            font-family: 'Orbitron';
            outline: none;
            box-shadow: inset 0 0 10px rgba(0, 171, 253, 0.2);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* CARD THEO PHONG CÁCH "CYBER" CỦA BẠN */
        .card {
            background: rgba(205, 241, 255, 0.05);
            border: 1px solid rgba(0, 171, 253, 0.3);
            border-radius: 4px; /* Bo góc nhẹ theo phong cách công nghiệp */
            overflow: hidden;
            transition: 0.3s;
            backdrop-filter: blur(10px);
            position: relative;
        }

        /* Hiệu ứng góc vuông của card */
        .card::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 10px; height: 10px;
            border-top: 2px solid var(--accent);
            border-left: 2px solid var(--accent);
        }

        .card:hover {
            background: rgba(0, 171, 253, 0.1);
            box-shadow: 0 0 30px rgba(0, 171, 253, 0.3);
            transform: scale(1.02);
        }

        .card-img {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-img img {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 0 10px var(--accent));
        }

        .card-label {
            background: var(--text-cyan);
            color: #00242e;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            border-top: 1px solid var(--accent);
        }

        /* NÚT THÊM SƠ ĐỒ */
        .add-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px dashed var(--accent);
            color: var(--accent);
            text-decoration: none;
            min-height: 245px;
        }

        .add-card:hover { background: rgba(0, 171, 253, 0.1); color: white; }

        footer {
            text-align: center;
            padding: 40px;
            opacity: 0.4;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>SƠ ĐỒ MẠCH ĐIỆN</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="SCANNING SYSTEM...">
    </div>

    <div class="grid">
        <div class="card" onclick="window.open('machsaotamgiac.png')">
            <div class="card-img"><img src="machsaotamgiac.png" alt="Băng tải"></div>
            <div class="card-label">Hệ thống Băng tải</div>
        </div>

        <div class="card">
            <div class="card-img"><div style="color:#555">S7-1200_DATA</div></div>
            <div class="card-label">Tủ PLC Siemens S7-1200</div>
        </div>

        <a href="#" class="card add-card">
            <div style="font-size: 40px;">+</div>
            <div>THÊM HỆ THỐNG</div>
        </a>
    </div>

    <footer>DESIGNER VIETNAM | IDI FACTORY AUTOMATION 2026</footer>

</body>
</html>
