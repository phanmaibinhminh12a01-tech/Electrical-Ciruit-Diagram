<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Dashboard | IDI Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #00242e; /* Xanh cực tối cho nền chuyên nghiệp */
            --primary-blue: #00ABFD;
            --deep-blue: #00587C;
            --text-light: #CDF1FF;
            --glass: rgba(205, 241, 255, 0.05);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--bg-body);
            color: white;
            margin: 0; padding: 0;
            /* Hiệu ứng nền kỹ thuật số mờ */
            background-image: radial-gradient(circle at center, #004d63 0%, #00242e 100%);
            min-height: 100vh;
        }

        /* --- Header đẳng cấp --- */
        header {
            text-align: center;
            padding: 40px 0;
            position: relative;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: var(--text-light);
            letter-spacing: 8px;
            margin: 0;
            text-shadow: 0 0 20px var(--primary-blue), 0 0 40px rgba(0, 171, 253, 0.3);
        }

        header::after {
            content: '';
            display: block;
            width: 60%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary-blue), transparent);
            margin: 20px auto;
        }

        /* --- Search Bar mờ ảo --- */
        .search-section { text-align: center; margin-bottom: 50px; }
        #searchInput {
            background: var(--glass);
            border: 1px solid var(--deep-blue);
            padding: 15px 30px;
            border-radius: 30px;
            width: 400px;
            color: white;
            backdrop-filter: blur(10px);
            transition: 0.3s;
            outline: none;
            border: 1px solid rgba(0, 171, 253, 0.3);
        }
        #searchInput:focus { width: 500px; border-color: var(--primary-blue); box-shadow: 0 0 15px var(--primary-blue); }

        /* --- Container --- */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }

        /* --- Card thiết kế theo hình ảnh của bạn --- */
        .card {
            background: var(--glass);
            border: 1px solid rgba(0, 88, 124, 0.5);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: scale(1.05);
            border-color: var(--primary-blue);
            box-shadow: 0 10px 30px rgba(0, 171, 253, 0.4);
        }

        .card-image-box {
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.2);
        }

        .card-image-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px var(--primary-blue));
        }

        .card-label {
            background: var(--text-light);
            color: var(--bg-body);
            padding: 15px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        /* --- Nút Thêm Sơ Đồ --- */
        .add-btn {
            border: 2px dashed var(--deep-blue);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 245px;
            color: var(--primary-blue);
            text-decoration: none;
            transition: 0.3s;
        }
        .add-btn:hover { background: rgba(0, 171, 253, 0.1); border-color: var(--primary-blue); color: white; }
        .plus { font-size: 3rem; margin-bottom: 10px; }

        footer {
            text-align: center;
            padding: 50px;
            opacity: 0.5;
            font-size: 0.8rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SƠ ĐỒ MẠCH ĐIỆN</h1>
    </header>

    <div class="search-section">
        <input type="text" id="searchInput" onkeyup="search()" placeholder="Truy xuất hệ thống...">
    </div>

    <div class="container">
        <div class="grid" id="mainGrid">
            <div class="card" onclick="window.open('machsaotamgiac.png','_blank')">
                <div class="card-image-box">
                    <img src="machsaotamgiac.png" alt="Băng tải">
                </div>
                <div class="card-label">Hệ thống Băng tải</div>
            </div>

            <div class="card">
                <div class="card-image-box">
                    <span style="color:#444">PLC IMAGE (Chưa có file)</span>
                </div>
                <div class="card-label">Tủ PLC Siemens S7-1200</div>
            </div>

            <div class="card">
                <div class="card-image-box">
                    <span style="color:#444">ROBOT IMAGE (Chưa có file)</span>
                </div>
                <div class="card-label">Mạch Điều khiển Robot</div>
            </div>

            <div class="card">
                <div class="card-image-box">
                    <span style="color:#444">TEMP IMAGE (Chưa có file)</span>
                </div>
                <div class="card-label">Sơ đồ Đo nhiệt độ</div>
            </div>

            <a href="https://github.com/phanmaibinhminh12a01-tech/Electrical-Circuit-Diagram/upload/main" class="card add-btn">
                <div class="plus">+</div>
                <div>THÊM SƠ ĐỒ</div>
            </a>
        </div>
    </div>

    <footer>
        DESIGNER VIETNAM | IDI FACTORY AUTOMATION 2026
    </footer>

    <script>
        function search() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let i = 0; i < cards.length; i++) {
                let text = cards[i].innerText.toLowerCase();
                cards[i].style.display = text.includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
