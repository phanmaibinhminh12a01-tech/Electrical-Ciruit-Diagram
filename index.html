<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Sơ Đồ Mạch Điện | IDI</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #003140;
            --accent-blue: #00ABFD;
            --light-cyan: #CDF1FF;
            --glass: rgba(0, 49, 64, 0.7);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            /* SỬ DỤNG ẢNH NỀN MÌNH VỪA TẠO */
            background-image: linear-gradient(rgba(0, 49, 64, 0.8), rgba(0, 49, 64, 0.8)), url('ciruit-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 50px 20px 10px;
        }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: white;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 0 15px var(--accent-blue);
        }

        /* Thanh tìm kiếm dẹt và mờ đúng kiểu HMI */
        .search-container {
            text-align: center;
            margin: 30px 0 50px;
        }

        #searchInput {
            background: rgba(205, 241, 255, 0.1);
            border: 1px solid var(--accent-blue);
            padding: 10px 25px;
            border-radius: 20px;
            width: 450px;
            max-width: 80%;
            color: var(--light-cyan);
            outline: none;
            backdrop-filter: blur(5px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Thẻ Card đúng phong cách hình mẫu */
        .card {
            background: var(--glass);
            border: 1px solid rgba(0, 171, 253, 0.4);
            border-radius: 8px;
            overflow: hidden;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(0, 171, 253, 0.4);
        }

        .card-img {
            height: 160px;
            background: rgba(255, 255, 255, 0.9); /* Nền trắng cho ảnh sơ đồ nổi bật */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .card-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-label {
            background: var(--light-cyan);
            color: #003140;
            padding: 12px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* Thẻ thêm mới */
        .add-card {
            border: 2px dashed var(--accent-blue);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 215px;
            color: var(--accent-blue);
            text-decoration: none;
            background: rgba(0, 171, 253, 0.05);
        }

        .add-card:hover {
            background: rgba(0, 171, 253, 0.15);
            color: white;
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.5;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SƠ ĐỒ MẠCH ĐIỆN</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="filter()" placeholder="Tìm kiếm hệ thống thiết bị...">
    </div>

    <div class="grid" id="mainGrid">
        <div class="card" onclick="window.open('machsaotamgiac.png')">
            <div class="card-img">
                <img src="machsaotamgiac.png" alt="Băng tải">
            </div>
            <div class="card-label">Hệ thống Băng tải</div>
        </div>

        <div class="card">
            <div class="card-img">
                <div style="color:#aaa; font-size: 12px;">[ PLC S7-1200 ]</div>
            </div>
            <div class="card-label">Tủ PLC Siemens S7-1200</div>
        </div>

        <div class="card">
            <div class="card-img">
                <div style="color:#aaa; font-size: 12px;">[ ROBOT ARM ]</div>
            </div>
            <div class="card-label">Mạch Điều khiển Robot</div>
        </div>

        <a href="https://github.com/phanmaibinhminh12a01-tech/Electrical-Circuit-Diagram/upload/main" class="card add-card">
            <div style="font-size: 40px; margin-bottom: 5px;">+</div>
            <div style="font-weight: bold;">THÊM SƠ ĐỒ</div>
        </a>
    </div>

    <footer>
        DESIGNER VIETNAM | IDI FACTORY AUTOMATION 2026
    </footer>

    <script>
        function filter() {
            let val = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for (let card of cards) {
                let txt = card.innerText.toLowerCase();
                card.style.display = txt.includes(val) ? "" : "none";
            }
        }
    </script>

</body>
</html>
