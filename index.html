<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Mạch Điện - Công Nghệ Tự Động Hóa</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #003140;
            --accent-deep: #00587C;
            --accent-bright: #00ABFD;
            --light-blue: #CDF1FF;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, #004d63 0%, #003140 100%);
            color: var(--text-white);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--accent-bright);
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            color: var(--light-blue);
            text-shadow: 0 0 10px var(--accent-bright);
        }

        .search-bar {
            text-align: center;
            margin-bottom: 30px;
        }

        #searchInput {
            background: rgba(205, 241, 255, 0.1);
            border: 1px solid var(--accent-bright);
            padding: 10px 20px;
            border-radius: 25px;
            color: var(--light-blue);
            width: 80%;
            max-width: 500px;
            outline: none;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: rgba(0, 88, 124, 0.4);
            border: 1px solid var(--accent-deep);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            border-color: var(--accent-bright);
            box-shadow: 0 0 20px rgba(0, 171, 253, 0.4);
            transform: translateY(-5px);
        }

        .card-img {
            width: 100%;
            height: 150px;
            background: #004d63;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .card-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-title {
            background: var(--light-blue);
            color: var(--bg-dark);
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        /* Thẻ thêm sơ đồ */
        .card-add {
            border: 2px dashed var(--accent-bright);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--accent-bright);
            font-weight: bold;
            text-decoration: none;
        }

        .card-add:hover { background: rgba(0, 171, 253, 0.1); }
        .plus-icon { font-size: 40px; margin-bottom: 10px; }

        footer {
            margin-top: 50px;
            text-align: center;
            font-size: 0.8em;
            color: var(--accent-deep);
        }
    </style>
</head>
<body>

<header>
    <h1>SƠ ĐỒ MẠCH ĐIỆN</h1>
</header>

<div class="search-bar">
    <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Tìm kiếm hệ thống...">
</div>

<div class="grid-container" id="mainGrid">
    <div class="card" onclick="window.open('machsaotamgiac.png', '_blank')">
        <div class="card-img"><img src="machsaotamgiac.png" alt="Băng tải"></div>
        <div class="card-title">Hệ thống Băng tải</div>
    </div>

    <div class="card">
        <div class="card-img"><img src="https://via.placeholder.com/150/004d63/CDF1FF?text=PLC+S7-1200" alt="PLC"></div>
        <div class="card-title">Tủ PLC Siemens S7-1200</div>
    </div>

    <div class="card">
        <div class="card-img"><img src="https://via.placeholder.com/150/004d63/CDF1FF?text=Robot+Arm" alt="Robot"></div>
        <div class="card-title">Mạch Điều khiển Robot</div>
    </div>

    <div class="card">
        <div class="card-img"><img src="https://via.placeholder.com/150/004d63/CDF1FF?text=Temp+Control" alt="Nhiệt độ"></div>
        <div class="card-title">Sơ đồ Đo nhiệt độ</div>
    </div>

    <a href="https://github.com/phanmaibinhminh12a01-tech/Electrical-Ciruit-Diagram/upload/main" class="card card-add" target="_blank">
        <div class="plus-icon">+</div>
        <div>Thêm Sơ đồ</div>
    </a>
</div>

<footer>
    <p>Designer Vietnam | Hệ thống quản lý kỹ thuật IDI</p>
</footer>

<script>
    function filterCards() {
        let input = document.getElementById('searchInput').value.toUpperCase();
        let cards = document.getElementsByClassName('card');
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].innerText.toUpperCase();
            if (title.indexOf(input) > -1) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>

</body>
</html>
