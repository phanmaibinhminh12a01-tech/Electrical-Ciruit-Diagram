<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sơ Đồ Mạch Điện - IDI Factory Automation</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Bảng màu chính thức từ thiết kế của bạn */
            --bg-dark: #003140;
            --accent-deep: #00587C;
            --accent-bright: #00ABFD;
            --light-blue: #CDF1FF;
            --text-white: #ffffff;
            --card-bg: rgba(205, 241, 255, 0.05); /* Nền thẻ mờ */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            /* Tạo hiệu ứng nền lưới kỹ thuật nhẹ */
            background-image: 
                linear-gradient(rgba(0, 49, 64, 0.9), rgba(0, 26, 34, 1)),
                url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            color: var(--text-white);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- Header: SƠ ĐỒ MẠCH ĐIỆN --- */
        header {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid var(--accent-bright);
            box-shadow: 0 5px 15px rgba(0, 171, 253, 0.3); /* Bóng neon */
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin: 0;
            color: var(--light-blue);
            text-shadow: 0 0 15px var(--accent-bright);
            font-size: 2.5em;
        }

        /* --- Thanh tìm kiếm --- */
        .search-bar {
            width: 80%;
            max-width: 500px;
            margin-bottom: 40px;
        }

        #searchInput {
            width: 100%;
            background: rgba(205, 241, 255, 0.1);
            border: 1px solid var(--accent-deep);
            padding: 12px 20px;
            border-radius: 25px;
            color: var(--light-blue);
            font-size: 1em;
            outline: none;
            transition: 0.3s;
        }

        #searchInput:focus {
            border-color: var(--accent-bright);
            box-shadow: 0 0 10px rgba(0, 171, 253, 0.5);
        }

        /* --- Lưới hiển thị thẻ (Grid) --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- Định dạng Thẻ (Card) chuyên nghiệp --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--accent-deep);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease-out;
            cursor: pointer;
            backdrop-filter: blur(5px); /* Hiệu ứng làm mờ nền sau thẻ */
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
        }

        /* Hiệu ứng khi di chuột vào thẻ */
        .card:hover {
            border-color: var(--accent-bright);
            box-shadow: 0 0 25px rgba(0, 171, 253, 0.6);
            transform: translateY(-8px);
        }

        /* Phần chứa ảnh sơ đồ */
        .card-img {
            width: 100%;
            height: 180px;
            background: rgba(0, 49, 64, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(205, 241, 255, 0.1);
        }

        .card-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain; /* Giữ nguyên tỷ lệ sơ đồ */
            filter: drop-shadow(0 0 5px var(--light-blue)); /* Làm sơ đồ "sáng" lên */
        }

        /* Khi không có ảnh, hiện chữ placeholder */
        .no-img {
            color: #555;
            font-size: 0.8em;
            text-transform: uppercase;
        }

        /* Phần chứa tiêu đề thẻ (Nền màu xanh nhạt) */
        .card-title {
            background: var(--light-blue);
            color: var(--bg-dark);
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 0.95em;
            text-transform: uppercase;
            margin-top: auto; /* Đẩy tiêu đề xuống đáy thẻ */
        }

        /* --- Thẻ "Thêm Sơ đồ" đặc biệt --- */
        .card-add {
            border: 2px dashed rgba(0, 171, 253, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 232px; /* Bằng chiều cao các thẻ khác */
            color: var(--accent-bright);
            font-weight: bold;
            text-decoration: none;
            background: rgba(0, 171, 253, 0.02);
        }

        .card-add:hover {
            background: rgba(0, 171, 253, 0.1);
            border-style: solid;
        }

        .plus-icon {
            font-size: 50px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--accent-bright);
        }

        /* --- Footer --- */
        footer {
            margin-top: 60px;
            padding: 20px;
            text-align: center;
            font-size: 0.8em;
            color: rgba(205, 241, 255, 0.3);
            border-top: 1px solid rgba(205, 241, 255, 0.1);
            width: 80%;
        }

    </style>
</head>
<body>

<header>
    <h1>SƠ ĐỒ MẠCH ĐIỆN</h1>
</header>

<div class="search-bar">
    <input type="text" id="searchInput" onkeyup="filterCards()" placeholder="Tìm kiếm hệ thống hoặc thiết bị...">
</div>

<div class="grid-container" id="mainGrid">
    <div class="card" onclick="window.open('machsaotamgiac.png', '_blank')">
        <div class="card-img">
            <img src="machsaotamgiac.png" alt="Sơ đồ Băng tải">
        </div>
        <div class="card-title">Hệ thống Băng tải</div>
    </div>

    <div class="card">
        <div class="card-img">
            <div class="no-img">Chưa có ảnh (Upload tu-plc.png)</div>
        </div>
        <div class="card-title">Tủ PLC Siemens S7-1200</div>
    </div>

    <div class="card">
        <div class="card-img">
            <div class="no-img">Chưa có ảnh (Upload mach-robot.png)</div>
        </div>
        <div class="card-title">Mạch Điều khiển Robot</div>
    </div>

    <div class="card">
        <div class="card-img">
            <div class="no-img">Chưa có ảnh (Upload so-do-nhiet.png)</div>
        </div>
        <div class="card-title">Sơ đồ Đo nhiệt độ</div>
    </div>

    <a href="https://github.com/phanmaibinhminh12a01-tech/Electrical-Ciruit-Diagram/upload/main" class="card card-add" target="_blank">
        <div class="plus-icon">+</div>
        <div>Thêm Sơ đồ</div>
    </a>
</div>

<footer>
    Designer Vietnam | Hệ thống quản lý kỹ thuật IDI Factory Automation
</footer>

<script>
    // Hàm tìm kiếm thông minh
    function filterCards() {
        let input = document.getElementById('searchInput').value.toUpperCase();
        let cards = document.getElementsByClassName('card');
        for (let i = 0; i < cards.length; i++) {
            // Lấy toàn bộ văn bản trong thẻ để tìm kiếm
            let content = cards[i].innerText.toUpperCase();
            if (content.indexOf(input) > -1) {
                cards[i].style.display = "";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>

</body>
</html>
