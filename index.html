<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Sơ Đồ Điện | IDI</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-color: #0056b3; --bg-color: #f8f9fa; }
        body { font-family: 'Roboto', sans-serif; background: var(--bg-color); margin: 0; padding: 0; }
        header { background: var(--primary-color); color: white; padding: 20px; text-align: center; }
        .search-container { text-align: center; margin: 20px; }
        #searchInput { padding: 12px; width: 80%; max-width: 400px; border-radius: 25px; border: 1px solid #ddd; outline: none; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }
        .card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 150px; object-fit: cover; background: #eee; border-bottom: 1px solid #eee; }
        .card-content { padding: 15px; }
        .status-tag { background: #28a745; color: white; padding: 3px 8px; border-radius: 5px; font-size: 0.8em; }
        .btn-view { display: block; text-align: center; background: var(--primary-color); color: white; padding: 10px; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>HỆ THỐNG SƠ ĐỒ ĐIỆN NHÀ MÁY</h1>
    <p>Trạm Kỹ Thuật - Kỹ sư: Bình Minh</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" onkeyup="filterTus()" placeholder="Tìm tên tủ điện hoặc khu vực...">
</div>

<div class="grid-container" id="tuGrid">
    <div class="card">
        <img src="machsaotamgiac.png" class="card-img" alt="Thumbnail">
        <div class="card-content">
            <span class="status-tag">Hoạt động tốt</span>
            <h3>Tủ Sao - Tam Giác 01</h3>
            <p>📍 Khu vực: Bơm nước thải</p>
            <p>📅 Cập nhật: 10/05/2026</p>
            <a href="machsaotamgiac.png" target="_blank" class="btn-view">XEM SƠ ĐỒ CHI TIẾT</a>
        </div>
    </div>

    <div class="card">
        <div style="height:150px; background:#ddd; display:flex; align-items:center; justify-content:center; color:#666;">Chưa có ảnh</div>
        <div class="card-content">
            <span class="status-tag" style="background:#ffc107">Đang bảo trì</span>
            <h3>Tủ Động Lực MSB-02</h3>
            <p>📍 Khu vực: Máy nén khí</p>
            <p>📅 Cập nhật: 01/05/2026</p>
            <a href="#" class="btn-view" style="background:#6c757d">CHƯA CẬP NHẬT</a>
        </div>
    </div>
</div>

<script>
    function filterTus() {
        let input = document.getElementById('searchInput').value.toUpperCase();
        let cards = document.getElementsByClassName('card');
        for (let i = 0; i < cards.length; i++) {
            let content = cards[i].innerText.toUpperCase();
            cards[i].style.display = content.indexOf(input) > -1 ? "" : "none";
        }
    }
</script>

</body>
</html>
